name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Download Pyodide
        run: |
          cd dist
          wget --timeout=60 --tries=3 -q -O pyodide.zip https://github.com/pyodide/pyodide/releases/download/0.26.2/pyodide-0.26.2-full.zip
          unzip -q -o pyodide.zip -d pyodide-temp
          mkdir -p pyodide
          cp -r pyodide-temp/*/* pyodide/ 2>/dev/null || cp -r pyodide-temp/* pyodide/
          rm -rf pyodide-temp pyodide.zip

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
